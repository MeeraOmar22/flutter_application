<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scrapbook</title>
    <link rel="stylesheet" href="scrapbook.css">
</head>
<body>
    <h1 class="title">A Little Birthday Scrapbook</h1>
    <div class="scrapbook">
        <div class="scrap-item">
            <p class="message">Wishing you another year of laughter and love!</p>
        </div>
        <div class="scrap-item">
            <img src="img/banner.png" alt="Banner">
        </div>
        <div class="scrap-item">
            <img src="img/cake.gif" alt="Cake">
        </div>
        <div class="scrap-item">
            <p class="message">Here's to many more memories together.</p>
        </div>
    </div>
    <div class="audio">
        <audio controls loop>
            <source src="music.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>
</body>
</html>
